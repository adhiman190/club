<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership — PCTE ClubHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-animated"></div>
<div class="app-layout" id="appLayout"></div>
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const layout = document.getElementById('appLayout');
  const role = sessionStorage.getItem('userRole') || 'student';

  const myMemberships = [
    { club: CLUBS[0], joinDate:'2023-08-15', status:'active', role:'Member', eventsAttended:5, cert:true },
    { club: CLUBS[6], joinDate:'2024-01-10', status:'active', role:'Team Captain', eventsAttended:12, cert:true },
    { club: CLUBS[15], joinDate:'2024-08-01', status:'active', role:'RJ Host', eventsAttended:8, cert:false },
  ];

  const pendingRequests = [
    { id:1, student:'Karan Mehta', roll:'2K23/CE/024', club:'Adventure Club', requestDate:'2025-09-01', status:'pending' },
    { id:2, student:'Riya Sharma', roll:'2K23/CS/056', club:'Dance Club', requestDate:'2025-09-03', status:'pending' },
    { id:3, student:'Amit Verma', roll:'2K22/ME/019', club:'Basketball Club', requestDate:'2025-09-05', status:'pending' },
  ];

  const allMembers = MEMBERS;

  layout.innerHTML = `
    ${renderSidebar('membership')}
    <div class="main-content">
      ${renderTopbar('Membership', 'Manage club memberships')}
      <div class="page-content">

        ${role === 'student' ? renderStudentMembership(myMemberships) : ''}
        ${role === 'coordinator' ? renderCoordMembership(pendingRequests, allMembers) : ''}
        ${role === 'admin' ? renderAdminMembership(pendingRequests, allMembers) : ''}

      </div>
    </div>`;

  function renderStudentMembership(memberships) {
    return `
    <!-- MY CLUBS -->
    <div class="mb-28">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
        <h2 style="font-family:'Outfit',sans-serif;font-size:20px;font-weight:700">My Club Memberships</h2>
        <a href="clubs.html" class="btn btn-primary btn-sm">➕ Join More Clubs</a>
      </div>
      <div class="grid-auto">
        ${memberships.map(m=>`
        <div class="club-card">
          <div class="club-card-banner" style="background:linear-gradient(135deg,${m.club.color}33,${m.club.color}11)">
            <span>${m.club.emoji}</span>
          </div>
          <div class="club-card-body">
            <div class="club-card-name">${m.club.name}</div>
            <div style="margin-bottom:12px">
              <span class="club-tag">${m.role}</span>
              <span class="status-badge status-active" style="margin-left:4px">Active</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;font-size:13px;color:var(--text-secondary)">
              <div style="display:flex;justify-content:space-between"><span>Joined</span><span>${new Date(m.joinDate).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span></div>
              <div style="display:flex;justify-content:space-between"><span>Events Attended</span><strong style="color:var(--primary)">${m.eventsAttended}</strong></div>
              <div style="display:flex;justify-content:space-between"><span>Coordinator</span><span>${m.club.coordinator.split(' ').slice(-1)[0]}</span></div>
            </div>
            <div class="progress" style="margin-bottom:16px">
              <div class="progress-bar" style="width:${m.eventsAttended/m.club.events*100}%;background:${m.club.color}"></div>
            </div>
            <p style="font-size:11px;color:var(--text-muted);margin-bottom:14px">Attended ${m.eventsAttended} of ${m.club.events} events (${Math.round(m.eventsAttended/m.club.events*100)}%)</p>
            <div style="display:flex;gap:8px">
              ${m.cert ? `<a href="certificates.html" class="btn btn-sm btn-success" style="flex:1;justify-content:center">🏆 Certificate</a>` : ''}
              <button class="btn btn-sm btn-danger" style="padding:8px 14px" onclick="leaveClub('${m.club.name}')">Leave</button>
            </div>
          </div>
        </div>`).join('')}
      </div>
    </div>

    <!-- PARTICIPATION HISTORY -->
    <div class="card">
      <div class="card-header"><div class="card-title">📊 Participation History</div></div>
      <div class="card-body" style="padding:0">
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Event</th><th>Club</th><th>Date</th><th>Role</th><th>Certificate</th>
            </tr></thead>
            <tbody>
              ${EVENTS.filter(e=>e.registered).map(ev=>{
                const club = CLUBS.find(c=>c.id===ev.clubId);
                return `<tr>
                  <td><div style="font-weight:600">${ev.name}</div></td>
                  <td><span class="club-tag">${club?club.emoji+' '+club.name:''}</span></td>
                  <td style="color:var(--text-secondary)">${new Date(ev.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
                  <td style="color:var(--text-muted)">Participant</td>
                  <td>
                    ${ev.status==='completed'
                      ? `<a href="certificates.html" style="color:var(--primary);font-weight:600;font-size:13px">🏆 Download</a>`
                      : `<span style="color:var(--text-muted);font-size:13px">—</span>`}
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  function renderCoordMembership(pending, members) {
    return `
    <!-- PENDING REQUESTS -->
    <div class="card mb-24">
      <div class="card-header">
        <div class="card-title">⏳ Pending Membership Requests</div>
        <span class="status-badge status-pending">${pending.length} Pending</span>
      </div>
      <div class="card-body" style="padding:0">
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Student</th><th>Roll No</th><th>Club</th><th>Requested</th><th>Actions</th>
            </tr></thead>
            <tbody>
              ${pending.map(r=>`<tr>
                <td>
                  <div style="display:flex;align-items:center;gap:10px">
                    <div class="avatar" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark))">👤</div>
                    <strong>${r.student}</strong>
                  </div>
                </td>
                <td style="color:var(--text-muted);font-size:13px">${r.roll}</td>
                <td><span class="club-tag">${r.club}</span></td>
                <td style="color:var(--text-muted);font-size:13px">${new Date(r.requestDate).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</td>
                <td>
                  <div style="display:flex;gap:8px">
                    <button class="btn btn-sm btn-success" onclick="approveReq(${r.id},'${r.student}')">✅ Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="rejectReq(${r.id},'${r.student}')">✕ Reject</button>
                  </div>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    ${renderMembersTable(members)}`;
  }

  function renderAdminMembership(pending, members) {
    return `
    <!-- STATS -->
    <div class="stats-grid mb-24" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="stat-card" style="--stat-color:#6c63ff;padding:16px"><div class="stat-value" style="font-size:28px">${members.length}</div><div class="stat-label">Total Members</div></div>
      <div class="stat-card" style="--stat-color:#10b981;padding:16px"><div class="stat-value" style="font-size:28px">${members.filter(m=>m.status==='active').length}</div><div class="stat-label">Active</div></div>
      <div class="stat-card" style="--stat-color:#f59e0b;padding:16px"><div class="stat-value" style="font-size:28px">${pending.length}</div><div class="stat-label">Pending</div></div>
      <div class="stat-card" style="--stat-color:#3b82f6;padding:16px"><div class="stat-value" style="font-size:28px">17</div><div class="stat-label">Clubs</div></div>
    </div>
    ${renderCoordMembership(pending, members)}`;
  }

  function renderMembersTable(members) {
    return `
    <div class="card">
      <div class="card-header">
        <div class="card-title">👥 All Members</div>
        <div class="search-bar" style="display:flex;min-width:220px">
          <span>🔍</span>
          <input type="text" placeholder="Search members..." />
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Student</th><th>Roll No</th><th>Dept</th><th>Clubs</th><th>Joined</th><th>Status</th>
            </tr></thead>
            <tbody>
              ${members.map(m=>`<tr>
                <td>
                  <div style="display:flex;align-items:center;gap:10px">
                    <div class="avatar" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));font-size:18px">${m.avatar}</div>
                    <strong>${m.name}</strong>
                  </div>
                </td>
                <td style="color:var(--text-muted);font-size:13px">${m.roll}</td>
                <td style="color:var(--text-secondary);font-size:13px">${m.dept}</td>
                <td>
                  <div style="display:flex;flex-wrap:wrap;gap:4px">
                    ${m.clubs.map(c=>`<span class="club-tag" style="font-size:11px;padding:3px 8px">${c.replace(' Club','')}</span>`).join('')}
                  </div>
                </td>
                <td style="color:var(--text-muted);font-size:13px">${new Date(m.joinDate).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
                <td><span class="status-badge status-${m.status}">${m.status}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  window.leaveClub = function(name) {
    if (confirm(`Leave ${name}? This cannot be undone.`)) showToast(`Left ${name}.`, 'warning');
  };
  window.approveReq = function(id, name) {
    showToast(`Membership approved for ${name}!`, 'success');
  };
  window.rejectReq = function(id, name) {
    showToast(`Membership request rejected for ${name}.`, 'error');
  };
});
</script>
</body>
</html>
