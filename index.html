<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCTE Club Management System — Login</title>
  <meta name="description"
    content="Login to PCTE Group of Institutes Club Management System. Manage clubs, events, memberships, and more." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="bg-animated"></div>

  <!-- FLOATING ORBS -->
  <div style="position:fixed;inset:0;pointer-events:none;z-index:0;">
    <div
      style="position:absolute;top:15%;left:10%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,0.15),transparent);animation:pulse-glow 4s ease infinite;">
    </div>
    <div
      style="position:absolute;bottom:20%;right:10%;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,0.1),transparent);animation:pulse-glow 4s 2s ease infinite;">
    </div>
  </div>



  <!-- LOGIN PAGE -->
  <div id="loginPage" class="login-page" style="position:relative;z-index:1;">
    <div class="login-container">
      <div class="login-logo animate-fade-up">
        <div class="logo-icon" style="background:white;border-radius:16px;padding:6px;display:flex;align-items:center;justify-content:center;width:80px;height:80px;margin:0 auto 8px;">
          <img src="pcte-logo.jpg" alt="PCTE Logo" style="width:100%;height:100%;object-fit:contain;border-radius:10px;" />
        </div>
        <h1>PCTE <span>ClubHub</span></h1>
        <p>PCTE Group of Institutes · Club Management System</p>
      </div>

      <div class="login-card animate-fade-up" style="animation-delay:0.1s">
        <div class="role-tabs">
          <button class="role-tab active" onclick="setRole('student',this)" id="tab-student">🎓 Student</button>
          <button class="role-tab" onclick="setRole('coordinator',this)" id="tab-coord">🧑‍💼 Coordinator</button>
          <button class="role-tab" onclick="setRole('admin',this)" id="tab-admin">🔐 Admin</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="you@pcte.edu.in" required />
          </div>
          <div class="form-group">
            <label for="loginPass">Password</label>
            <input type="password" id="loginPass" class="form-control" placeholder="Enter your password" required />
          </div>

          <div class="flex items-center justify-between mb-20" style="flex-wrap:wrap;gap:10px;">
            <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;">
              <input type="checkbox" style="accent-color:var(--primary);width:16px;height:16px;" />
              Remember me
            </label>
            <a href="#" style="color:var(--primary);font-size:14px;text-decoration:none;">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary animate-pulse" id="loginBtn">
            <span id="loginBtnText">Sign In to Dashboard</span>
          </button>
        </form>

        <div class="divider"><span>New here?</span></div>

        <a href="register.html" class="btn btn-outline" style="width:100%;justify-content:center;">
          ✨ Create New Account
        </a>

        <div
          style="margin-top:20px;padding:14px;background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.2);border-radius:12px;">
          <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:8px;">Demo Credentials</p>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
            <button onclick="fillDemo('student@pcte.edu.in','student123','student')"
              style="padding:8px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:8px;color:#10b981;font-size:11px;cursor:pointer;">Student</button>
            <button onclick="fillDemo('coord@pcte.edu.in','coord123','coordinator')"
              style="padding:8px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);border-radius:8px;color:#f59e0b;font-size:11px;cursor:pointer;">Coordinator</button>
            <button onclick="fillDemo('admin@pcte.edu.in','admin123','admin')"
              style="padding:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:8px;color:#ef4444;font-size:11px;cursor:pointer;">Admin</button>
          </div>
        </div>
      </div>

      <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted);">
        © 2025 PCTE Group of Institutes · Club Management System v2.0
      </p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let currentRole = 'student';
    function setRole(role, el) {
      currentRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }
    function fillDemo(email, pass, role) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPass').value = pass;
      if (role) {
        const tabEl = document.getElementById(role === 'student' ? 'tab-student' : role === 'coordinator' ? 'tab-coord' : 'tab-admin');
        if (tabEl) setRole(role, tabEl);
      }
    }
    function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtnText');
      btn.textContent = 'Signing in...';
      // Store role and redirect
      sessionStorage.setItem('userRole', currentRole);
      sessionStorage.setItem('userName', currentRole === 'student' ? 'deepak Kumar' : currentRole === 'coordinator' ? ' abc' : 'Admin User');
      sessionStorage.setItem('userEmail', document.getElementById('loginEmail').value);
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</span><span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
    }
  </script>
</body>

</html>
