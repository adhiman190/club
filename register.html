<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — PCTE ClubHub</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="bg-animated"></div>
  <div style="position:fixed;inset:0;pointer-events:none;z-index:0;">
    <div
      style="position:absolute;top:15%;right:10%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,0.12),transparent);animation:pulse-glow 4s ease infinite;">
    </div>
    <div
      style="position:absolute;bottom:20%;left:10%;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,0.08),transparent);animation:pulse-glow 4s 2s ease infinite;">
    </div>
  </div>

  <div class="register-page" style="position:relative;z-index:1;">
    <div class="register-container">
      <div class="login-logo animate-fade-up">
        <div class="logo-icon">🏛️</div>
        <h1>Join <span>PCTE ClubHub</span></h1>
        <p>Create your student account to join clubs & events</p>
      </div>

      <div class="login-card animate-fade-up" style="animation-delay:0.1s">
        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="grid-2" style="gap:16px">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" class="form-control" placeholder="Arjun" required />
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" class="form-control" placeholder="Sharma" required />
            </div>
          </div>

          <div class="form-group">
            <label>College Email</label>
            <input type="email" class="form-control" placeholder="rollno@pcte.edu.in" required />
          </div>

          <div class="grid-2" style="gap:16px">
            <div class="form-group">
              <label>Roll Number</label>
              <input type="text" class="form-control" placeholder="2K23/CS/045" required />
            </div>
            <div class="form-group">
              <label>Department</label>
              <select class="form-control">
                <option>Computer Science (CSE)</option>
                <option>Information Technology (IT)</option>
                <option>Electronics (ECE)</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>MBA</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>Commerce</option>
              </select>
            </div>
          </div>

          <div class="grid-2" style="gap:16px">
            <div class="form-group">
              <label>Year of Study</label>
              <select class="form-control">
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
              </select>
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" class="form-control" placeholder="+91 98765 43210" />
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" placeholder="Create a strong password" required />
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" class="form-control" placeholder="Confirm your password" required />
          </div>

          <div class="form-group" style="margin-bottom:24px">
            <label
              style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;text-transform:none;font-size:14px;font-weight:400">
              <input type="checkbox" required
                style="accent-color:var(--primary);width:16px;height:16px;margin-top:2px;flex-shrink:0" />
              I agree to the <a href="#" style="color:var(--primary)">Terms & Conditions</a> and <a href="#"
                style="color:var(--primary)">Privacy Policy</a> of PCTE Group of Institutes Club Management System.
            </label>
          </div>

          <button type="submit" class="btn btn-primary">
            🚀 Create Account & Get Started
          </button>
        </form>

        <div class="divider"><span>Already have an account?</span></div>
        <a href="index.html" class="btn btn-outline" style="width:100%;justify-content:center;">
          🔐 Sign In
        </a>
      </div>

      <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
        © 2025 PCTE Group of Institutes · For student/faculty use only
      </p>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Creating account...';
      btn.disabled = true;
      setTimeout(() => {
        sessionStorage.setItem('userRole', 'student');
        sessionStorage.setItem('userName', 'New Student');
        window.location.href = 'dashboard.html';
      }, 1500);
    }
    function showToast(msg, type = 'info') {
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
      let c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
      c.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
    }
  </script>
</body>

</html>
